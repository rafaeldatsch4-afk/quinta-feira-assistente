# Publica a interface no GitHub Pages (branch gh-pages) a cada push no branch principal.
name: Publicar no GitHub Pages

on:
  push:
    branches: [ccr-1414dd0e-lg46pj, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Monta o site
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll

      - name: Envia para o branch gh-pages
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica site a partir de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
